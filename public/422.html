<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request not accepted | AndyPortfolio</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f8f7f3;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #596273;
      --accent: #2d6cdf;
      --border: #d9dde5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111827;
        --surface: #172033;
        --text: #f3f4f6;
        --muted: #c4cad5;
        --accent: #8ab4ff;
        --border: #2c374d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 38rem);
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
    }

    p {
      margin: 0 0 1.25rem;
      color: var(--muted);
    }

    .status {
      margin: 0 0 0.5rem;
      color: var(--accent);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration-thickness: 0.1em;
      text-underline-offset: 0.2em;
    }
  </style>
</head>
<body>
  <main>
    <p class="status">422</p>
    <h1>Request not accepted</h1>
    <p>The request could not be completed. Please review what you entered and try again.</p>
    <a href="/blogs">Return to the blog</a>
  </main>
</body>
</html>
