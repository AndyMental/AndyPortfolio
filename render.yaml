databases:
  - name: andyportfolio-db
    databaseName: andyportfolio
    user: andyportfolio
    plan: free

services:
  - type: web
    name: andyportfolio-web
    env: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    preDeployCommand: bundle exec rails db:prepare
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: andyportfolio-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: BLOG_ADMIN_TOKEN
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
